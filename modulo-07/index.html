<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximamente - Fase 2/3</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% -20%, #831843, #000000 80%);
      --card-bg: rgba(20, 10, 15, 0.7);
      --card-border: rgba(244, 114, 182, 0.2);
      --text: #fdf2f8;
      --muted: #9d8b95;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-gradient);
      background-color: #000000;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }

    .box {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 3rem 2rem;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      max-width: 420px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .badge {
      background: rgba(50, 40, 45, 0.5);
      color: #9d8b95;
      border: 1px solid rgba(157, 139, 149, 0.2);
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 1.5rem 0 0.5rem 0;
    }

    p {
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      color: #ffffff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
      transition: all 0.25s ease;
    }

    .btn:hover {
      filter: brightness(1.15);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
    }
  </style>
</head>
<body>

  <div class="box">
    <span class="badge">En Desarrollo</span>
    <h1>Próximamente - Fase 2/3</h1>
    <p>Este módulo estará disponible en las siguientes fases del curso de Cálculo Integral.</p>
    <a href="../index.html" class="btn">← Volver al Inicio</a>
  </div>

</body>
</html>
